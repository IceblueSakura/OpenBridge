<!doctype html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1" name="viewport"/>
    <title>OpenBridge API - Swagger UI</title>
    <link
            href="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.10/swagger-ui.css"
            rel="stylesheet"
    />
    <style>
        html {
            box-sizing: border-box;
        }

        *,
        *::before,
        *::after {
            box-sizing: inherit;
        }

        body {
            margin: 0;
            background: #fafafa;
        }
    </style>
</head>
<body>
<div id="swagger-ui"></div>
<script
        crossorigin="anonymous"
        src="https://cdn.jsdelivr.net/npm/swagger-ui-dist@5.11.10/swagger-ui-bundle.js"
></script>
<script>
    window.onload = function () {
        window.ui = SwaggerUIBundle({
            url: "/openapi.yaml",
            dom_id: "#swagger-ui",
            deepLinking: true,
            persistAuthorization: false,
        });
    };
</script>
</body>
</html>
