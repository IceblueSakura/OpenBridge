openapi: 3.0.3
info:
  title: OpenBridge API
  version: 0.1.0
  description: |
    OpenBridge downstream OpenAI-compatible API.

    This specification describes only endpoints actually provided by the current service. Models,
    Providers, upstream URLs, credentials, and routes are determined by the trusted code registry
    at server startup; clients can select only a Public Model.

    Request executability is determined by the fixed capability contract of the explicitly selected
    Public Model; capabilities do not participate in Public Model or Route selection. The OpenAPI
    schema does not mean that every model supports every optional capability.
servers:
  - url: /
    description: Current OpenBridge service
tags:
  - name: system
    description: Local service health and documentation resources
  - name: models
    description: Authenticated standard and extended Public Model information
  - name: chat
    description: Chat Completions-compatible endpoints
  - name: responses
    description: Responses-compatible endpoints
  - name: embeddings
    description: JSON-only Embeddings Create endpoint
paths:
  /healthz:
    get:
      tags: [ system ]
      summary: Check local service health
      operationId: getHealth
      description: Does not access an upstream Provider or credential; returns only the local process registry snapshot version.
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                registry_version: local

  /openapi.yaml:
    get:
      tags: [ system ]
      summary: Get the current OpenAPI specification
      operationId: getOpenApiSpec
      description: Returns the static OpenAPI YAML built with the current service.
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /swagger-ui:
    get:
      tags: [ system ]
      summary: Open Swagger UI test page
      operationId: getSwaggerUi
      description: Returns a Swagger UI page that loads the local OpenAPI specification.
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /v1/models:
    get:
      tags: [ models ]
      summary: List Public Models
      operationId: listModels
      description: Returns only Public Models declared by the server code registry; it does not enumerate upstream models or Providers.
      security:
        - BearerAuth: [ ]
      responses:
        '200':
          description: Public Model list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
              example:
                object: list
                data:
                  - id: gpt-5.6-sol
                    object: model
                    created: 1785715200
                    owned_by: openbridge
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/models/{model}:
    get:
      tags: [ models ]
      summary: Get a standard Public Model
      operationId: retrieveModel
      description: Returns the four-field OpenAI Model object used by the standard list without extended capability fields.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Standard Public Model object
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

  /openbridge/v1/models:
    get:
      tags: [ models ]
      summary: List Public Model extended capabilities
      operationId: listExtendedModels
      description: |
        Returns model facts precompiled by the immutable registry and one fixed capability contract
        per protocol. The response contains no Provider, Target, Route, upstream model, endpoint,
        credential, health, or pricing information. When native_protocol is present, only Public
        Models with at least one executable Native candidate for that downstream generation protocol
        are retained; Bridge-only interfaces do not match and candidate topology remains private.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/NativeProtocol'
      responses:
        '200':
          description: Public Model extended-capability list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedModelListResponse'
        '400':
          $ref: '#/components/responses/ModelsQueryBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openbridge/v1/models/{model}:
    get:
      tags: [ models ]
      summary: Get a Public Model extended-capability object
      operationId: retrieveExtendedModel
      description: Returns the complete object matching the corresponding extended-list element field for field.
      security:
        - BearerAuth: [ ]
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Public Model extended-capability object
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

  /v1/chat/completions:
    post:
      tags: [ chat ]
      summary: Create a Chat Completion
      operationId: createChatCompletion
      description: |
        Accepts a Chat Completions JSON request and executes Native forwarding or a restricted
        Chat-to-Responses bridge through the complete route. When stream is true, successful
        responses use text/event-stream. Tool calls are forwarded at the wire level only;
        OpenBridge does not execute tools. Image parts require a model whose fixed Chat interface
        exposes multimodal_input.image and are supported only on a same-protocol Native route. File
        parts likewise require multimodal_input.file; file_id and Bridge conversion are unsupported.
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              nonStreaming:
                summary: Non-streaming text request
                value:
                  model: deepseek-v4-flash
                  messages:
                    - role: user
                      content: hello
                  max_tokens: 2048
              streaming:
                summary: Streaming text request
                value:
                  model: deepseek-v4-flash
                  messages:
                    - role: user
                      content: hello
                  max_tokens: 2048
                  stream: true
                  stream_options:
                    include_usage: true
              imageUnderstanding:
                summary: Image-understanding request
                value:
                  model: mimo-v2.5
                  messages:
                    - role: user
                      content:
                        - type: image_url
                          image_url:
                            url: https://example.com/image.png
                        - type: text
                          text: Describe the image.
      responses:
        '200':
          description: Non-streaming JSON or streaming SSE response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerSentEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/responses:
    post:
      tags: [ responses ]
      summary: Create a Response
      operationId: createResponse
      description: |
        Accepts a Responses JSON request and executes Native forwarding or a restricted
        Responses-to-Chat bridge through the complete route. OpenBridge's core compatibility
        surface is stateless Responses: store may be omitted or false, every Responses egress
        request encodes store:false, and store:true is rejected before egress. A non-blank string
        instructions value wins; omission uses the project default. Existing previous_response_id
        and background capability rules remain separate. When stream is true, successful responses use
        text/event-stream. Image parts require a model whose fixed Responses interface exposes
        multimodal_input.image and are supported only on a same-protocol Native route. input_file
        likewise requires multimodal_input.file; file_id and Bridge conversion are unsupported.
        reasoning.summary accepts the standard value "auto" and the OpenBridge compatibility value
        false. Native Responses preserves the value. Responses-to-Chat consumes it and returns any
        actual Chat reasoning_content as Responses reasoning_text content rather than fabricating a summary.
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            examples:
              nonStreaming:
                summary: Non-streaming text request
                value:
                  model: deepseek-v4-flash
                  input:
                    - role: user
                      content: hello
                  include:
                    - reasoning.encrypted_content
                  reasoning:
                    effort: medium
                    summary: false
                  store: false
              streaming:
                summary: Streaming text request
                value:
                  model: deepseek-v4-flash
                  input:
                    - role: user
                      content: hello
                  stream: true
                  include:
                    - reasoning.encrypted_content
                  reasoning:
                    effort: medium
                    summary: auto
                  store: false
              imageUnderstanding:
                summary: Image-understanding request
                value:
                  model: mimo-v2.5
                  input:
                    - role: user
                      content:
                        - type: input_image
                          image_url: https://example.com/image.png
                        - type: input_text
                          text: Describe the image.
      responses:
        '200':
          description: Non-streaming JSON or streaming SSE response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerSentEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/embeddings:
    post:
      tags: [ embeddings ]
      summary: Create embeddings
      operationId: createEmbedding
      description: |
        Accepts one strict OpenAI-compatible Embeddings JSON request and executes the single Native
        candidate owned by the selected Public Model's fixed `interfaces.embeddings` contract.
        The model interface is authoritative for accepted input forms, encodings, dimensions, and
        effective limits. The response is read and validated under a bounded JSON budget before any
        bytes are committed downstream. Streaming and Embeddings bridges are not supported.
      security:
        - BearerAuth: [ ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmbeddingRequest'
            examples:
              stringBatch:
                summary: Float embeddings for two text inputs
                value:
                  model: qwen3.7-text-embedding
                  input: [ alpha, beta ]
                  encoding_format: float
      responses:
        '200':
          description: Fully validated Embeddings JSON response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EmbeddingResponse'
        '400':
          $ref: '#/components/responses/EmbeddingBadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '413':
          $ref: '#/components/responses/EmbeddingRequestTooLarge'
        '415':
          $ref: '#/components/responses/EmbeddingUnsupportedMediaType'
        '429':
          $ref: '#/components/responses/EmbeddingUpstreamError'
        '500':
          $ref: '#/components/responses/EmbeddingConfigurationError'
        '502':
          $ref: '#/components/responses/EmbeddingUpstreamError'
        '503':
          $ref: '#/components/responses/EmbeddingUpstreamError'
        '504':
          $ref: '#/components/responses/EmbeddingGatewayTimeout'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Static downstream Bearer API key configured in config/users.toml.

  headers:
    X-Request-Id:
      description: Request ID generated or propagated by OpenBridge for this request.
      schema:
        type: string

  parameters:
    ModelId:
      name: model
      in: path
      required: true
      description: Stable single-segment model ID exposed by OpenBridge downstream.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'
    NativeProtocol:
      name: native_protocol
      in: query
      required: false
      description: >-
        Filters the extended list to Public Models whose fixed execution interface contains at
        least one Native candidate for this downstream generation protocol. Omission returns the
        full visible list. Empty, repeated, or unsupported values are rejected rather than ignored.
      schema:
        type: string
        enum: [ chat_completions, responses ]

  responses:
    BadRequest:
      description: The request JSON is invalid, or the selected Public Model's fixed interface contract does not support the requested capability.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Request body is invalid
              type: invalid_request_error
              param: null
              code: invalid_request_error
    ModelsQueryBadRequest:
      description: The Native protocol filter is empty, repeated, or unsupported, or the query contains an unknown parameter.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The query parameter is invalid
              type: invalid_request_error
              param: native_protocol
              code: invalid_query_parameter
    Unauthorized:
      description: The downstream Bearer API key is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Invalid authentication credentials
              type: invalid_request_error
              param: null
              code: invalid_api_key
    ModelNotFound:
      description: The Public Model is not declared in the current registry.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The requested model does not exist or is not available
              type: invalid_request_error
              param: model
              code: model_not_found
    UnsupportedMediaType:
      description: The request must use application/json.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Content-Type must be application/json
              type: invalid_request_error
              param: null
              code: invalid_content_type
    BadGateway:
      description: No safe candidate completed the upstream request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request failed
              type: invalid_request_error
              param: null
              code: upstream_error
    GatewayTimeout:
      description: The upstream request timed out.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request timed out
              type: invalid_request_error
              param: null
              code: upstream_timeout
    EmbeddingBadRequest:
      description: The strict request shape is invalid, or the selected model's fixed Embeddings interface does not support the requested field or limit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The selected model does not support the requested Embeddings capability
              type: invalid_request_error
              param: dimensions
              code: unsupported_model_capability
    EmbeddingRequestTooLarge:
      description: The request body exceeds the configured ingress limit before any upstream attempt.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The request body exceeds the configured limit
              type: invalid_request_error
              param: null
              code: request_too_large
    EmbeddingUnsupportedMediaType:
      description: The Embeddings request must use application/json.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Content-Type must be application/json
              type: invalid_request_error
              param: null
              code: unsupported_media_type
    EmbeddingConfigurationError:
      description: The compiled Embeddings route cannot be resolved at runtime.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The configured Embeddings route is unavailable
              type: server_error
              param: null
              code: configuration_error
    EmbeddingUpstreamError:
      description: The upstream attempt failed, rejected the request, exhausted its finite budget, or returned an invalid success body. Upstream bodies and private headers are not exposed.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request failed
              type: server_error
              param: null
              code: upstream_error
    EmbeddingGatewayTimeout:
      description: The Embeddings upstream request timed out before downstream commit.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request timed out
              type: server_error
              param: null
              code: upstream_timeout

  schemas:
    HealthResponse:
      type: object
      required: [ status, registry_version ]
      properties:
        status:
          type: string
          enum: [ ok ]
        registry_version:
          type: string

    ModelListResponse:
      type: object
      required: [ object, data ]
      properties:
        object:
          type: string
          enum: [ list ]
        data:
          type: array
          items:
            $ref: '#/components/schemas/StandardModel'

    StandardModel:
      type: object
      additionalProperties: false
      required: [ id, object, created, owned_by ]
      properties:
        id:
          type: string
          description: Stable model name exposed by OpenBridge downstream.
        object:
          type: string
          enum: [ model ]
        created:
          type: integer
          format: int64
          minimum: 1
          description: Stable Unix seconds when the Public Model contract was first created.
        owned_by:
          type: string
          enum: [ openbridge ]

    ExtendedModelListResponse:
      type: object
      additionalProperties: false
      required: [ object, data ]
      properties:
        object:
          type: string
          enum: [ list ]
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicModelInfo'

    PublicModelInfo:
      type: object
      additionalProperties: false
      required:
        [ schema_version, id, object, created, owned_by, name, description, lifecycle, capabilities, interfaces ]
      properties:
        schema_version:
          type: string
          enum: [ '1' ]
        id:
          type: string
        object:
          type: string
          enum: [ model ]
        created:
          type: integer
          format: int64
          minimum: 1
        owned_by:
          type: string
          enum: [ openbridge ]
        name:
          type: string
        description:
          type: string
          nullable: true
        lifecycle:
          $ref: '#/components/schemas/ModelLifecycle'
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        interfaces:
          $ref: '#/components/schemas/ModelInterfaces'

    ModelLifecycle:
      type: object
      additionalProperties: false
      required: [ status, deprecated_at, retired_at ]
      properties:
        status:
          type: string
          enum: [ active, deprecated, retired ]
        deprecated_at:
          type: integer
          format: int64
          nullable: true
        retired_at:
          type: integer
          format: int64
          nullable: true

    ContextWindow:
      type: object
      additionalProperties: false
      required: [ max_context_tokens, max_input_tokens, max_output_tokens ]
      properties:
        max_context_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        max_input_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    ModelModalities:
      type: object
      additionalProperties: false
      required: [ input, output ]
      properties:
        input:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ text, image, audio, file, video ]
        output:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ text, image, audio, embedding ]

    ModelCapabilities:
      type: object
      additionalProperties: false
      description: Stable model facts. Request parameters are exposed only by the selected interface contract.
      required:
        [ tasks, context_window, modalities, tokenizer, knowledge_cutoff, reasoning ]
      properties:
        tasks:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ chat, text_generation, embedding ]
        context_window:
          $ref: '#/components/schemas/ContextWindow'
        modalities:
          $ref: '#/components/schemas/ModelModalities'
        tokenizer:
          type: string
          nullable: true
        knowledge_cutoff:
          type: string
          nullable: true
        reasoning:
          $ref: '#/components/schemas/ModelReasoningCapabilities'

    ModelReasoningCapabilities:
      type: object
      additionalProperties: false
      required: [ support, levels ]
      properties:
        support:
          $ref: '#/components/schemas/SupportState'
        levels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasoningEffort'

    ModelInterfaces:
      type: object
      additionalProperties: false
      required: [ chat_completions, responses, embeddings ]
      properties:
        chat_completions:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelInterfaceCapabilities'
        responses:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelInterfaceCapabilities'
        embeddings:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbeddingInterfaceCapabilities'

    EmbeddingInterfaceCapabilities:
      type: object
      additionalProperties: false
      required: [ input_forms, encoding, dimensions, limits, supported_parameters ]
      properties:
        input_forms:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EmbeddingInputForm'
        encoding:
          $ref: '#/components/schemas/EmbeddingEncodingCapabilities'
        dimensions:
          $ref: '#/components/schemas/EmbeddingDimensionCapabilities'
        limits:
          $ref: '#/components/schemas/EmbeddingLimits'
        supported_parameters:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [ dimensions, encoding_format, user ]

    EmbeddingInputForm:
      type: string
      enum: [ string, string_array, token_array, token_array_array ]

    EmbeddingEncoding:
      type: string
      enum: [ float, base64 ]

    EmbeddingEncodingCapabilities:
      type: object
      additionalProperties: false
      required: [ default, allowed ]
      properties:
        default:
          $ref: '#/components/schemas/EmbeddingEncoding'
        allowed:
          type: array
          nullable: true
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/EmbeddingEncoding'

    EmbeddingDimensionCapabilities:
      type: object
      additionalProperties: false
      required: [ default, allowed ]
      properties:
        default:
          type: integer
          format: int64
          minimum: 1
          maximum: 4294967295
        allowed:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/EmbeddingDimensionDomain'

    EmbeddingDimensionDomain:
      oneOf:
        - $ref: '#/components/schemas/EmbeddingDimensionRange'
        - $ref: '#/components/schemas/EmbeddingDimensionValues'

    EmbeddingDimensionRange:
      type: object
      additionalProperties: false
      required: [ kind, minimum, maximum ]
      properties:
        kind:
          type: string
          enum: [ range ]
        minimum:
          type: integer
