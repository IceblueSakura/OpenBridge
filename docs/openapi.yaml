        parallel_tool_calls:
          type: boolean
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        reasoning:
          type: object
          additionalProperties: true
        max_tokens:
          type: integer
          format: int64
          minimum: 0
        max_completion_tokens:
          type: integer
          format: int64
          minimum: 0
        response_format:
          type: object
          additionalProperties: true
        store:
          type: boolean
          enum: [ false ]
          default: false
          description: Only the stateless false value is accepted.
        metadata:
          type: object
          additionalProperties: true
        service_tier:
          type: string
        user:
          type: string
        safety_identifier:
          type: string
        prompt_cache_key:
          type: string
          description: Forwarded exactly when advertised by the selected fixed interface; OpenBridge does not guarantee a cache hit or any cache effect.
        prompt_cache_options:
          type: object
          additionalProperties: true
        prompt_cache_retention:
          type: string
        moderation:
          $ref: '#/components/schemas/KnownGenerationParameter'
        modalities:
          type: array
          items:
            type: string
        audio:
          type: object
          additionalProperties: true
        asr_options:
          type: object
          additionalProperties: true
        optimize_text_preview:
          type: boolean
        prediction:
          type: object
          additionalProperties: true
        web_search_options:
          type: object
          additionalProperties: true
        functions:
          type: array
          items:
            type: object
            additionalProperties: true
        function_call:
          $ref: '#/components/schemas/KnownGenerationParameter'
        verbosity:
          type: string

    ResponsesRequest:
      type: object
      required: [ model ]
      additionalProperties: false
      description: Responses JSON recognized by OpenBridge. Stateless requests are the core compatibility surface, and the selected Public Model may reject any listed optional field outside its fixed interface.
      properties:
        model:
          type: string
          description: OpenBridge Public Model name.
          example: gpt-5.6-sol
        input:
          nullable: true
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ResponsesInputItem'
            - type: object
              additionalProperties: true
        stream:
          type: boolean
          default: false
        temperature:
          type: number
          nullable: true
        top_p:
          type: number
          nullable: true
        frequency_penalty:
          type: number
          nullable: true
        presence_penalty:
          type: number
          nullable: true
        seed:
          type: integer
          format: int64
          nullable: true
        n:
          type: integer
          minimum: 1
        logprobs:
          type: boolean
        top_logprobs:
          type: integer
          minimum: 0
        include_reasoning:
          type: boolean
        logit_bias:
          type: object
          additionalProperties:
            type: number
        min_p:
          type: number
        top_k:
          type: integer
        top_a:
          type: number
        repetition_penalty:
          type: number
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        structured_outputs:
          $ref: '#/components/schemas/KnownGenerationParameter'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
          $ref: '#/components/schemas/KnownGenerationParameter'
        parallel_tool_calls:
          type: boolean
        reasoning:
          type: object
          additionalProperties: true
          properties:
            effort:
              $ref: '#/components/schemas/ReasoningEffort'
            summary:
              description: |
                "auto" is the standard automatic-summary request. false is an OpenBridge compatibility
                value that declines a summary without disabling reasoning. Native Responses preserves the
                exact value; Responses-to-Chat consumes it and represents actual Chat reasoning_content as
                reasoning_text with an empty summary array.
              oneOf:
                - type: string
                  enum: [ auto ]
                - type: boolean
                  enum: [ false ]
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
        store:
          type: boolean
          enum: [ false ]
          default: false
          description: Omission is normalized to false and every Responses upstream request explicitly carries false.
        previous_response_id:
          type: string
          nullable: true
        background:
          type: boolean
        text:
          type: object
          additionalProperties: true
        metadata:
          type: object
          additionalProperties: true
        service_tier:
          type: string
        user:
          type: string
        safety_identifier:
          type: string
        prompt_cache_key:
          type: string
          description: Forwarded exactly when advertised by the selected fixed interface; OpenBridge does not guarantee a cache hit or any cache effect.
