          type: object
          additionalProperties: true
        prompt_cache_retention:
          type: string
        moderation:
          $ref: '#/components/schemas/KnownGenerationParameter'
        modalities:
          type: array
          items:
            type: string
        audio:
          type: object
          additionalProperties: true
        instructions:
          type: string
          minLength: 1
          pattern: '.*\S.*'
          description: Exact non-blank client instruction; omission uses the project-wide default and explicit null or non-string values are invalid.
        conversation:
          oneOf:
            - type: string
            - type: object
              additionalProperties: true
        prompt:
          type: object
          additionalProperties: true
        context_management:
          $ref: '#/components/schemas/KnownGenerationParameter'
        include:
          type: array
          uniqueItems: true
          description: Additional output projections; an empty array is normalized as a no-op and every non-empty value must be supported by the selected fixed interface.
          items:
            $ref: '#/components/schemas/ResponseInclude'
        truncation:
          type: string
        max_tool_calls:
          type: integer
          minimum: 1

