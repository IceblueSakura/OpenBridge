openapi: 3.0.3
info:
  title: OpenBridge API
  version: 0.1.0
  description: |
    OpenBridge downstream OpenAI-compatible API.

    This specification describes only endpoints actually provided by the current service. Models,
    Providers, upstream URLs, credentials, and routes are determined by the trusted code registry
    at server startup; clients can select only a Public Model.

    Request executability is determined by the fixed capability contract of the explicitly selected
    Public Model; capabilities do not participate in Public Model or Route selection. The OpenAPI
    schema does not mean that every model supports every optional capability.
servers:
  - url: /
    description: Current OpenBridge service
tags:
  - name: system
    description: Local service health and documentation resources
  - name: models
    description: Authenticated standard and extended Public Model information
  - name: chat
    description: Chat Completions-compatible endpoints
  - name: responses
    description: Responses-compatible endpoints
paths:
  /healthz:
    get:
      tags: [system]
      summary: Check local service health
      operationId: getHealth
      description: Does not access an upstream Provider or credential; returns only the local process registry snapshot version.
      responses:
        '200':
          description: Service is healthy
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
              example:
                status: ok
                registry_version: local

  /openapi.yaml:
    get:
      tags: [system]
      summary: Get the current OpenAPI specification
      operationId: getOpenApiSpec
      description: Returns the static OpenAPI YAML built with the current service.
      responses:
        '200':
          description: OpenAPI YAML document
          content:
            application/yaml:
              schema:
                type: string

  /swagger-ui:
    get:
      tags: [system]
      summary: Open Swagger UI test page
      operationId: getSwaggerUi
      description: Returns a Swagger UI page that loads the local OpenAPI specification.
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /swagger-ui/:
    get:
      tags: [system]
      summary: Open Swagger UI test page
      operationId: getSwaggerUiWithTrailingSlash
      description: Canonical URL for the Swagger UI test page.
      responses:
        '200':
          description: Swagger UI HTML page
          content:
            text/html:
              schema:
                type: string

  /v1/models:
    get:
      tags: [models]
      summary: List Public Models
      operationId: listModels
      description: Returns only Public Models declared by the server code registry; it does not enumerate upstream models or Providers.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Public Model list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ModelListResponse'
              example:
                object: list
                data:
                  - id: code-primary
                    object: model
                    created: 1785715200
                    owned_by: openbridge
        '401':
          $ref: '#/components/responses/Unauthorized'

  /v1/models/{model}:
    get:
      tags: [models]
      summary: Get a standard Public Model
      operationId: retrieveModel
      description: Returns the four-field OpenAI Model object used by the standard list without extended capability fields.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Standard Public Model object
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

  /openbridge/v1/models:
    get:
      tags: [models]
      summary: List Public Model extended capabilities
      operationId: listExtendedModels
      description: |
        Returns model facts precompiled by the immutable registry and one fixed capability contract
        per protocol. The response contains no Provider, Target, Route, upstream model, endpoint,
        credential, health, or pricing information.
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Public Model extended-capability list
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtendedModelListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /openbridge/v1/models/{model}:
    get:
      tags: [models]
      summary: Get a Public Model extended-capability object
      operationId: retrieveExtendedModel
      description: Returns the complete object matching the corresponding extended-list element field for field.
      security:
        - BearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ModelId'
      responses:
        '200':
          description: Public Model extended-capability object
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicModelInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'

  /v1/chat/completions:
    post:
      tags: [chat]
      summary: Create a Chat Completion
      operationId: createChatCompletion
      description: |
        Accepts a Chat Completions JSON request and executes Native forwarding or a restricted
        Chat-to-Responses bridge through the complete route. When stream is true, successful
        responses use text/event-stream. Tool calls are forwarded at the wire level only;
        OpenBridge does not execute tools.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChatCompletionRequest'
            examples:
              nonStreaming:
                summary: Non-streaming text request
                value:
                  model: code-primary
                  messages:
                    - role: user
                      content: hello
              streaming:
                summary: Streaming text request
                value:
                  model: code-primary
                  messages:
                    - role: user
                      content: hello
                  stream: true
      responses:
        '200':
          description: Non-streaming JSON or streaming SSE response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ChatCompletionResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerSentEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

  /v1/responses:
    post:
      tags: [responses]
      summary: Create a Response
      operationId: createResponse
      description: |
        Accepts a Responses JSON request and executes Native forwarding or a restricted
        Responses-to-Chat bridge through the complete route. OpenBridge's core compatibility
        surface is stateless Responses; store, previous_response_id, and background are governed
        by the selected Public Model's fixed capability contract. State affinity continues to
        constrain subsequent execution and fallback. When stream is true, successful responses use
        text/event-stream.
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResponsesRequest'
            examples:
              nonStreaming:
                summary: Non-streaming text request
                value:
                  model: code-primary
                  input: hello
              streaming:
                summary: Streaming text request
                value:
                  model: code-primary
                  input: hello
                  stream: true
      responses:
        '200':
          description: Non-streaming JSON or streaming SSE response
          headers:
            X-Request-Id:
              $ref: '#/components/headers/X-Request-Id'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResponsesResponse'
            text/event-stream:
              schema:
                $ref: '#/components/schemas/ServerSentEvents'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/ModelNotFound'
        '415':
          $ref: '#/components/responses/UnsupportedMediaType'
        '502':
          $ref: '#/components/responses/BadGateway'
        '504':
          $ref: '#/components/responses/GatewayTimeout'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API key
      description: Static downstream Bearer API key configured in config/users.toml.

  headers:
    X-Request-Id:
      description: Request ID generated or propagated by OpenBridge for this request.
      schema:
        type: string

  parameters:
    ModelId:
      name: model
      in: path
      required: true
      description: Stable single-segment model ID exposed by OpenBridge downstream.
      schema:
        type: string
        pattern: '^[A-Za-z0-9][A-Za-z0-9._:-]{0,127}$'

  responses:
    BadRequest:
      description: The request JSON is invalid, or the selected Public Model's fixed interface contract does not support the requested capability.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Request body is invalid
              type: invalid_request_error
              param: null
              code: invalid_request_error
    Unauthorized:
      description: The downstream Bearer API key is missing or invalid.
      headers:
        WWW-Authenticate:
          schema:
            type: string
            example: Bearer
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Invalid authentication credentials
              type: invalid_request_error
              param: null
              code: invalid_api_key
    ModelNotFound:
      description: The Public Model is not declared in the current registry.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The requested model does not exist or is not available
              type: invalid_request_error
              param: model
              code: model_not_found
    UnsupportedMediaType:
      description: The request must use application/json.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: Content-Type must be application/json
              type: invalid_request_error
              param: null
              code: invalid_content_type
    BadGateway:
      description: No safe candidate completed the upstream request.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request failed
              type: invalid_request_error
              param: null
              code: upstream_error
    GatewayTimeout:
      description: The upstream request timed out.
      headers:
        X-Request-Id:
          $ref: '#/components/headers/X-Request-Id'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            error:
              message: The upstream request timed out
              type: invalid_request_error
              param: null
              code: upstream_timeout

  schemas:
    HealthResponse:
      type: object
      required: [status, registry_version]
      properties:
        status:
          type: string
          enum: [ok]
        registry_version:
          type: string

    ModelListResponse:
      type: object
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/StandardModel'

    StandardModel:
      type: object
      additionalProperties: false
      required: [id, object, created, owned_by]
      properties:
        id:
          type: string
          description: Stable model name exposed by OpenBridge downstream.
        object:
          type: string
          enum: [model]
        created:
          type: integer
          format: int64
          minimum: 1
          description: Stable Unix seconds when the Public Model contract was first created.
        owned_by:
          type: string
          enum: [openbridge]

    ExtendedModelListResponse:
      type: object
      additionalProperties: false
      required: [object, data]
      properties:
        object:
          type: string
          enum: [list]
        data:
          type: array
          items:
            $ref: '#/components/schemas/PublicModelInfo'

    PublicModelInfo:
      type: object
      additionalProperties: false
      required:
        [schema_version, id, object, created, owned_by, name, description, lifecycle, capabilities, interfaces]
      properties:
        schema_version:
          type: string
          enum: ['1']
        id:
          type: string
        object:
          type: string
          enum: [model]
        created:
          type: integer
          format: int64
          minimum: 1
        owned_by:
          type: string
          enum: [openbridge]
        name:
          type: string
        description:
          type: string
          nullable: true
        lifecycle:
          $ref: '#/components/schemas/ModelLifecycle'
        capabilities:
          $ref: '#/components/schemas/ModelCapabilities'
        interfaces:
          $ref: '#/components/schemas/ModelInterfaces'

    ModelLifecycle:
      type: object
      additionalProperties: false
      required: [status, deprecated_at, retired_at]
      properties:
        status:
          type: string
          enum: [active, deprecated, retired]
        deprecated_at:
          type: integer
          format: int64
          nullable: true
        retired_at:
          type: integer
          format: int64
          nullable: true

    ContextWindow:
      type: object
      additionalProperties: false
      required: [max_context_tokens, max_input_tokens, max_output_tokens]
      properties:
        max_context_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        max_input_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        max_output_tokens:
          type: integer
          format: int64
          minimum: 1
          nullable: true

    ModelModalities:
      type: object
      additionalProperties: false
      required: [input, output]
      properties:
        input:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [text, image, audio, file]
        output:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [text, image, audio]

    ModelCapabilities:
      type: object
      additionalProperties: false
      required:
        [tasks, context_window, modalities, supported_parameters, tokenizer, knowledge_cutoff, reasoning]
      properties:
        tasks:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [chat, text_generation]
        context_window:
          $ref: '#/components/schemas/ContextWindow'
        modalities:
          $ref: '#/components/schemas/ModelModalities'
        supported_parameters:
          type: array
          uniqueItems: true
          items:
            type: string
        tokenizer:
          type: string
          nullable: true
        knowledge_cutoff:
          type: string
          nullable: true
        reasoning:
          $ref: '#/components/schemas/ModelReasoningCapabilities'

    ModelReasoningCapabilities:
      type: object
      additionalProperties: false
      required: [support, levels]
      properties:
        support:
          $ref: '#/components/schemas/SupportState'
        levels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasoningEffort'

    ModelInterfaces:
      type: object
      additionalProperties: false
      required: [chat_completions, responses]
      properties:
        chat_completions:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelInterfaceCapabilities'
        responses:
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ModelInterfaceCapabilities'

    ModelInterfaceCapabilities:
      type: object
      additionalProperties: false
      required:
        [context_window, modalities, supported_parameters, streaming, system_messages, tools, structured_outputs, reasoning, prompt_caching, state]
      properties:
        context_window:
          $ref: '#/components/schemas/ContextWindow'
        modalities:
          $ref: '#/components/schemas/ModelModalities'
        supported_parameters:
          type: array
          uniqueItems: true
          items:
            type: string
        streaming:
          $ref: '#/components/schemas/SupportState'
        system_messages:
          $ref: '#/components/schemas/SupportState'
        tools:
          $ref: '#/components/schemas/ToolCapabilities'
        structured_outputs:
          $ref: '#/components/schemas/StructuredOutputCapabilities'
        reasoning:
          $ref: '#/components/schemas/InterfaceReasoningCapabilities'
        prompt_caching:
          $ref: '#/components/schemas/SupportState'
        state:
          $ref: '#/components/schemas/StateCapabilities'

    SupportState:
      type: string
      enum: [supported, unsupported, unknown]
      description: unknown must not be treated as supported during request preflight.

    ToolCapabilities:
      type: object
      additionalProperties: false
      required: [support, types, tool_choice_modes, parallel_calls, strict_schema]
      properties:
        support:
          $ref: '#/components/schemas/SupportState'
        types:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [function]
        tool_choice_modes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [none, auto, required, named]
        parallel_calls:
          $ref: '#/components/schemas/SupportState'
        strict_schema:
          $ref: '#/components/schemas/SupportState'

    StructuredOutputCapabilities:
      type: object
      additionalProperties: false
      required: [support, modes, strict_schema]
      properties:
        support:
          $ref: '#/components/schemas/SupportState'
        modes:
          type: array
          uniqueItems: true
          items:
            type: string
            enum: [json_object, json_schema]
        strict_schema:
          $ref: '#/components/schemas/SupportState'

    InterfaceReasoningCapabilities:
      type: object
      additionalProperties: false
      required: [support, levels, output]
      properties:
        support:
          $ref: '#/components/schemas/SupportState'
        levels:
          type: array
          uniqueItems: true
          items:
            $ref: '#/components/schemas/ReasoningEffort'
        output:
          type: string
          enum: [unsupported, plain_text, summary, opaque, unknown]

    StateCapabilities:
      type: object
      additionalProperties: false
      required: [store, previous_response_id, background]
      properties:
        store:
          $ref: '#/components/schemas/SupportState'
        previous_response_id:
          $ref: '#/components/schemas/SupportState'
        background:
          $ref: '#/components/schemas/SupportState'

    ChatCompletionRequest:
      type: object
      required: [model, messages]
      additionalProperties: true
      description: Chat Completions JSON accepted by the current route. Unlisted valid fields are preserved unchanged along the Native path.
      properties:
        model:
          type: string
          description: OpenBridge Public Model name.
          example: code-primary
        messages:
          type: array
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        parallel_tool_calls:
          type: boolean
        reasoning_effort:
          $ref: '#/components/schemas/ReasoningEffort'
        max_tokens:
          type: integer
          format: int64
          minimum: 0
        max_completion_tokens:
          type: integer
          format: int64
          minimum: 0
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
        response_format:
          type: object
          additionalProperties: true
        store:
          type: boolean

    ResponsesRequest:
      type: object
      required: [model]
      additionalProperties: true
      description: Responses JSON accepted by the current route. Stateless requests are OpenBridge's core compatibility surface.
      properties:
        model:
          type: string
          description: OpenBridge Public Model name.
          example: code-primary
        input:
          nullable: true
          oneOf:
            - type: string
            - type: array
              items:
                type: object
                additionalProperties: true
            - type: object
              additionalProperties: true
        stream:
          type: boolean
          default: false
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        reasoning:
          type: object
          additionalProperties: true
          properties:
            effort:
              $ref: '#/components/schemas/ReasoningEffort'
        max_output_tokens:
          type: integer
          format: int64
          minimum: 0
        store:
          type: boolean
        previous_response_id:
          type: string
          nullable: true
        background:
          type: boolean

    ChatMessage:
      type: object
      required: [role]
      additionalProperties: true
      properties:
        role:
          type: string
          enum: [system, developer, user, assistant, tool]
        content:
          nullable: true
          oneOf:
            - type: string
            - type: array
              items:
                $ref: '#/components/schemas/ContentPart'
        name:
          type: string
        tool_call_id:
          type: string
        tool_calls:
          type: array
          items:
            type: object
            additionalProperties: true

    ContentPart:
      type: object
      required: [type]
      additionalProperties: true
      properties:
        type:
          type: string
        text:
          type: string
        image_url:
          type: object
          additionalProperties: true

    Tool:
      type: object
      required: [type]
      additionalProperties: true
      description: Wire-level description of a standard function tool; OpenBridge does not execute returned tool calls.
      properties:
        type:
          type: string
          example: function
        function:
          type: object
          additionalProperties: true

    ReasoningEffort:
      type: string
      enum: [none, minimal, low, medium, high, xhigh, max]

    ChatCompletionResponse:
      type: object
      additionalProperties: true
      description: Upstream Chat Completions JSON response preserved by the Native path except for trusted model rewriting.
      properties:
        id:
          type: string
        object:
          type: string
        model:
          type: string
        choices:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true

    ResponsesResponse:
      type: object
      additionalProperties: true
      description: Upstream Responses JSON response; specific output items depend on the current route and Provider capabilities.
      properties:
        id:
          type: string
        object:
          type: string
        status:
          type: string
        output:
          type: array
          items:
            type: object
            additionalProperties: true
        usage:
          type: object
          additionalProperties: true

    ServerSentEvents:
      type: string
      format: binary
      description: SSE stream preserving the target protocol's original event/data framing.

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: object
          required: [message, type, param, code]
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type: string
              nullable: true
            code:
              type: string
