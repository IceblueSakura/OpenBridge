    ChatCompletionRequest:
      type: object
      required: [ model, messages ]
      additionalProperties: false
      description: Chat Completions JSON recognized by OpenBridge. The selected Public Model may reject any listed optional field that its fixed interface does not support.
      properties:
        model:
          type: string
          description: OpenBridge Public Model name.
          example: gpt-5.6-sol
        messages:
          type: array
          minItems: 1
          description: The first plain non-blank system/developer string is the client instruction; otherwise OpenBridge prepends the project default without scanning later messages.
          items:
            $ref: '#/components/schemas/ChatMessage'
        stream:
          type: boolean
          default: false
        stream_options:
          type: object
          additionalProperties: false
          description: >-
            Accepted only with stream:true. An empty object or include_usage:false is an omitted-equivalent no-op
            removed before egress. include_usage:true requires the fixed Chat interface to list stream_options;
            Native Chat forwards it exactly, while Chat-to-Responses Bridge generates the standard usage-only tail.
            Other members, including include_obfuscation, are unsupported.
          properties:
            include_usage:
              type: boolean
        temperature:
          type: number
          nullable: true
        top_p:
          type: number
          nullable: true
        frequency_penalty:
          type: number
          nullable: true
        presence_penalty:
          type: number
          nullable: true
        seed:
          type: integer
          format: int64
          nullable: true
        n:
          type: integer
          minimum: 1
        logprobs:
          type: boolean
        top_logprobs:
          type: integer
          minimum: 0
        include_reasoning:
          type: boolean
        logit_bias:
          type: object
          additionalProperties:
            type: number
        min_p:
          type: number
        top_k:
          type: integer
        top_a:
          type: number
        repetition_penalty:
          type: number
        stop:
          oneOf:
            - type: string
            - type: array
              items:
                type: string
        structured_outputs:
          $ref: '#/components/schemas/KnownGenerationParameter'
        tools:
          type: array
          items:
            $ref: '#/components/schemas/Tool'
        tool_choice:
