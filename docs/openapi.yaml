          type: integer
          format: int64
          minimum: 0

    EmbeddingResponse:
      type: object
      additionalProperties: false
      required: [ object, data, model, usage ]
      properties:
        object:
          type: string
          enum: [ list ]
        data:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/EmbeddingData'
        model:
          type: string
          description: The downstream Public Model selected by the client.
        usage:
          $ref: '#/components/schemas/EmbeddingUsage'

    EmbeddingData:
      type: object
      additionalProperties: false
      required: [ object, embedding, index ]
      properties:
        object:
          type: string
          enum: [ embedding ]
        embedding:
          oneOf:
            - type: array
              minItems: 1
              items:
                type: number
                format: double
            - type: string
              format: byte
        index:
          type: integer
          format: int64
          minimum: 0
          maximum: 4294967295

    EmbeddingUsage:
      type: object
      additionalProperties: false
      required: [ prompt_tokens, total_tokens ]
      properties:
        prompt_tokens:
          type: integer
          format: int64
          minimum: 0
        total_tokens:
          type: integer
          format: int64
          minimum: 0

    ServerSentEvents:
      type: string
      format: binary
      description: SSE stream preserving the target protocol's original event/data framing.

    ErrorResponse:
      type: object
      additionalProperties: false
      required: [ error ]
      properties:
        error:
          type: object
          additionalProperties: false
          required: [ message, type, param, code ]
          properties:
            message:
              type: string
            type:
              type: string
            param:
              type: string
              nullable: true
            code:
              type: string
