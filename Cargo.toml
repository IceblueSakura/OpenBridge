[package]
name = "openbridge"
version = "0.1.0"
edition = "2024"
description = "Semantic IR, OpenAI-compatible codecs and lowering for OpenBridge v2."
license = "MIT"

[dependencies]
bytes = "1.12"
mime = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
reqwest = { version = "0.13", default-features = false, features = ["stream"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time"], default-features = false }
