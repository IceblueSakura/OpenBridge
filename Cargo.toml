[package]
name = "openbridge"
version = "0.1.0"
edition = "2024"
description = "Semantic IR and a minimal OpenAI-compatible text gateway for OpenBridge v2."
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
subtle = "2.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal", "io-util"], default-features = false }
bytes = "1.12"
base64 = "0.22"
url = "2.5"
mime = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"
strum = { version = "0.28", features = ["derive"] }
fs-mistrust = { version = "0.16", default-features = false }
atomicwrites = "0.4.4"
clap = { version = "4.6", default-features = false, features = ["std", "derive", "help", "usage"] }
serde_with = { version = "3", default-features = false, features = ["std"] }
secrecy = "0.10.3"
zeroize = "1.9"
oauth2 = { version = "5", default-features = false }
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
os_info = { version = "=3.14.0", default-features = false }
jsonwebtoken = { version = "11.1", default-features = false, features = ["aws_lc_rs"] }
httparse = "1"
oxc_regular_expression = "0.152"
oxc_allocator = "0.152"

[target.'cfg(windows)'.dependencies]
windows-permissions = "0.2.4"

[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"

[dev-dependencies]
proptest = { version = "1.11", default-features = false, features = ["std"] }
ring = "0.17"
tempfile = "3.27"
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53", default-features = false, features = ["process", "io-util"] }
