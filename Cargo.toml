[package]
name = "openbridge"
version = "0.1.0"
edition = "2024"
description = "A secure OpenAI-compatible model gateway and protocol bridge."
license = "MIT"

[dependencies]
anyhow = "1.0"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tower-log", "tracing"] }
base64 = "0.22"
bytes = "1.12"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.4"
http-body = "1.0"
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "http2"] }
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
subtle = "2.6"
thiserror = "2.0"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "time"], default-features = false }
toml = "1.1"
tower = { version = "0.5", features = ["util"], default-features = false }
tower-http = { version = "0.7", features = ["limit", "request-id", "sensitive-headers", "trace"], default-features = false }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], default-features = false }
url = "2.5"
zeroize = "1.9"
