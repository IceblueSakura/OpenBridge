[package]
name = "openbridge"
version = "0.1.0"
edition = "2024"
description = "A secure OpenAI-compatible model gateway and protocol bridge."
license = "MIT"
default-run = "openbridge"

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
axum = { version = "0.8", default-features = false, features = ["http1", "json", "matched-path", "tokio", "tower-log", "tracing"] }
base64 = "0.22"
bytes = "1.12"
bytesize = "2.7"
futures-util = { version = "0.3", default-features = false, features = ["std"] }
http = "1.4"
http-body = "1.0"
httpdate = "1.0"
humantime-serde = "1.1"
opentelemetry = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
opentelemetry-http = { version = "0.32", default-features = false }
opentelemetry-otlp = { version = "0.32", default-features = false, features = ["http-proto", "metrics", "reqwest-blocking-client", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "trace"] }
reqwest = { version = "0.13", default-features = false, features = ["blocking", "rustls", "stream", "http2"] }
rmcp = { version = "3.1.2", features = ["transport-streamable-http-server"] }
schemars = "1.1"
secrecy = "0.10"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
subtle = "2.6"
thiserror = "2.0"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "signal", "sync", "time"], default-features = false }
toml = "1.1"
tower = { version = "0.5", features = ["util"], default-features = false }
tower-http = { version = "0.7", features = ["limit", "request-id", "sensitive-headers", "trace"], default-features = false }
tracing = "0.1"
tracing-opentelemetry = { version = "0.33", default-features = false }
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"], default-features = false }
url = "2.5"
zeroize = "1.9"

[dev-dependencies]
opentelemetry-proto = { version = "0.32", default-features = false, features = ["gen-tonic-messages", "metrics", "trace"] }
opentelemetry_sdk = { version = "0.32", default-features = false, features = ["metrics", "testing"] }
prost = "0.14"
rmcp = { version = "3.1.2", features = ["client", "transport-streamable-http-client-reqwest"] }
