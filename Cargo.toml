[package]
name = "openbridge"
version = "0.1.0"
edition = "2024"
description = "Semantic IR and a minimal OpenAI-compatible text gateway for OpenBridge v2."
license = "MIT"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "json", "tokio"] }
futures-util = { version = "0.3", default-features = false, features = ["std"] }
getrandom = "0.4"
httpdate = "1.0"
reqwest = { version = "0.13", default-features = false, features = ["stream", "rustls"] }
subtle = "2.6"
tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"], default-features = false }
bytes = "1.12"
base64 = "0.22"
url = "2.5"
mime = "0.3"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.11"
thiserror = "2.0"

[dev-dependencies]
reqwest = { version = "0.13", default-features = false, features = ["json"] }
tower = { version = "0.5", features = ["util"] }
tokio = { version = "1.53", default-features = false, features = ["process", "io-util"] }
toml = "1"
