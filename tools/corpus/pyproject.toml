[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbridge-testkit"
version = "0.8.0"
description = "Standalone corpus and HTTP/SSE mock tools for OpenBridge protocol testing."
requires-python = ">=3.12"
dependencies = [
    "h11>=0.16,<1",
    "jsonschema[format]>=4.23,<5",
]

[project.scripts]
corpus = "openbridge_corpus.cli:main"
obtest = "openbridge_corpus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/openbridge_corpus"]

[tool.uv]
package = true
