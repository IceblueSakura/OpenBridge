[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "openbridge-corpus"
version = "0.1.0"
description = "Standalone validation, generation, reporting, and packaging tools for the OpenBridge protocol corpus."
requires-python = ">=3.12"
dependencies = [
    "jsonschema[format]>=4.23,<5",
]

[project.scripts]
corpus = "openbridge_corpus.cli:main"

[dependency-groups]
dev = [
    "pytest>=8.3,<9",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.uv]
package = true
