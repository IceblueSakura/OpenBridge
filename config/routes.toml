schema_version = 1
config_version = "dev-1"

[[models]]
id = "openai/configured-model"
name = "Configured OpenAI-compatible model"
description = "Example model metadata. Replace every field with values verified for the real upstream model."
# Keep this empty until the model's accepted request parameters have been verified.
supported_parameters = []
reasoning = "unknown"

# Configure verified token limits here when known. `input` is metadata until OpenBridge has a
# model-specific tokenizer; `output` is enforced against explicit request output limits.
# [models.context_length]
# input = 128000
# output = 16384

[[providers]]
id = "openai"
kind = "openai"

[providers.credential]
id = "openai-primary"
kind = "api_key"
secret_ref = "env://OPENAI_API_KEY"

[[deployments]]
id = "openai-main"
provider = "openai"
model = "openai/configured-model"
upstream_model = "configured-model"
endpoint_profile = "public-api"
base_url = "https://api.openai.com"
request_timeout_ms = 120000

[deployments.capabilities.chat_completions]
enabled = true
streaming = true
function_calling = true
# The sample does not claim that this placeholder model supports concurrent calls or image input.
parallel_tool_calls = false
image_input = false
structured_outputs = false
store = false

[deployments.capabilities.responses]
enabled = true
streaming = true
function_calling = true
parallel_tool_calls = false
image_input = false
structured_outputs = false
store = false
previous_response_id = false
background = false

[[aliases]]
name = "code-primary"
candidates = ["openai-main"]
