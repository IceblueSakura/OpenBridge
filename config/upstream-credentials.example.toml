schema_version = 1

# Copy this file to config/upstream-credentials.toml and replace every placeholder.
# Never commit the populated private file.
# Only registered pools with non-empty api_keys or an auth_json_file are active at startup.
# Omit a pool, leave its source fields absent, or use api_keys = [] to keep that Provider Target disabled.

[[credential_pools]]
id = "openai-primary"
api_keys = ["replace-with-openai-key"]

[[credential_pools]]
id = "longcat-primary"
api_keys = ["replace-with-longcat-key"]

[[credential_pools]]
id = "openrouter-primary"
api_keys = ["replace-with-openrouter-key"]

[[credential_pools]]
id = "deepseek-primary"
api_keys = ["replace-with-deepseek-key"]

[[credential_pools]]
id = "mimo-primary"
api_keys = ["replace-with-mimo-key"]

[[credential_pools]]
id = "nvidia-primary"
api_keys = ["replace-with-nvidia-key"]

[[credential_pools]]
id = "bailian-primary"
api_keys = ["replace-with-bailian-key"]

[[credential_pools]]
id = "kimi-primary"
api_keys = ["replace-with-kimi-key"]

# Required by the built-in ChatGPT Public Models. Relative paths resolve from this TOML directory.
# Run `cargo run --locked --bin openbridge-auth -- login chatgpt` before starting the service.
[[credential_pools]]
id = "chatgpt-codex"
auth_json_file = "replace-with-openbridge-chatgpt-auth.json"
