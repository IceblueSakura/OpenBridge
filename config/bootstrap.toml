# Selects the strict Bootstrap document schema accepted by this OpenBridge build.
schema_version = 3
# Binds the downstream server to a loopback-only socket address.
listen = "127.0.0.1:8080"
# Locates the private downstream user and API-key configuration file.
users_file = "config/users.toml"
# Locates the private upstream API-key and OAuth2 credential bindings.
upstream_credentials_file = "config/upstream-credentials.toml"
# Supplies the fallback instruction for every active general Generation interface.
default_instructions = "You are a coding agent. Follow the user's instructions carefully and use the provided tools when needed."
# Limits one downstream request body and bounds its optional log capture.
max_request_body = "512MiB"
# Limits buffered JSON responses and optional response-body log capture.
max_json_response_body = "100MiB"
# Limits replayable request bodies and must not exceed the request-body limit.
max_replay_body = "4MiB"
# Limits one decoded Server-Sent Events event.
max_sse_event = "4MiB"
# Limits one upstream TCP connection attempt.
upstream_connect_timeout = "5s"
# Retains an idle pooled upstream connection for at most five minutes.
upstream_pool_idle_timeout = "5m"
# Retains at most 16 idle upstream connections for one host.
upstream_pool_max_idle_per_host = 16

# Controls authenticated downstream HTTP diagnostics for the checked-in development profile.
[logging]
# Writes enabled authenticated HTTP snapshots to this absolute development JSONL directory.
http_jsonl_directory = "/var/lib/openbridge/http-logs"
# Logs sanitized downstream request-header snapshots at the info level.
request_headers = true
# Disables downstream request-body content logging.
request_body = false
# Logs sanitized final downstream response-header snapshots at the info level.
response_headers = true
# Disables downstream response-body content logging.
response_body = false

# Configures startup-owned OTLP/HTTP trace export; remove this table to disable it.
[telemetry.traces]
# Selects the collector base URL to which OpenBridge appends the fixed /v1/traces path.
otlp_http_endpoint = "http://127.0.0.1:4318"

# Configures startup-owned OTLP/HTTP metrics export; remove this table to disable it.
[telemetry.metrics]
# Selects the collector base URL to which OpenBridge appends the fixed /v1/metrics path.
otlp_http_endpoint = "http://127.0.0.1:4318"
